const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const products=[['Хлеб',45,69,'🥖'],['Молоко',55,89,'🥛'],['Яйца',80,119,'🥚'],['Кофе',180,299,'☕'],['Шоколад',70,129,'🍫'],['Вода',30,59,'💧']];

const suppliers={fast:{name:'Быстрый',mult:1.12,time:4,fee:650,desc:'Дороже, но товар приходит быстро.'},standard:{name:'Стандарт',mult:1,time:7,fee:900,desc:'Баланс цены и скорости.'},bulk:{name:'Опт',mult:.88,time:11,fee:1300,desc:'Дешевле, но доставка дольше.'}};
function supplierCost(i){const sp=suppliers[s.supplier]||suppliers.standard;return Math.round(products[i][1]*sp.mult*(1+(s.costTrend[i]||0)/100))}function effectivePrice(i){return Math.max(1,Math.round(s.prices[i]*(1-(s.promo[i]||0)/100)))}function demand(i){const base=[1.05,.95,.85,.72,.9,1.1][i];const market=products[i][2];const priceRatio=s.prices[i]/market;const pricePenalty=priceRatio<=1?1+Math.min(.18,(1-priceRatio)*.45):Math.max(.35,1-(priceRatio-1)*1.05);const stock=s.shelf[i]>0?1:(s.warehouse[i]>0?.45:0);const promoBoost=s.promo[i]?1.22:1;return Math.max(0,Math.min(1.45,base*pricePenalty*promoBoost*stock))}function recPrice(i){return Math.max(products[i][1]+5,Math.round(supplierCost(i)*2.05*(demand(i)>.95?1.04:.96)))}
function spawn(){if(s.paused||s.customers.length>=11)return;const available=products.map((p,i)=>s.shelf[i]>0?i:-1).filter(i=>i>=0);if(!available.length)return;const t=types[Math.floor(Math.random()*types.length)];const prod=available[Math.floor(Math.random()*available.length)];const patience=t[0]==='Экономный'?34:t[0]==='Состоятельный'?24:t[0]==='Семья'?42:30;const preferred=Math.floor(Math.random()*products.length);s.visitors++;s.dayVisitors++;s.customers.push({id:Math.random(),x:65,y:390,tx:190+Math.random()*240,ty:300+Math.random()*110,state:'enter',type:t[0],mult:t[1],budget:t[2],accept:t[3],target:t[4],prod,cart:[],wait:0,anim:0,basket:Math.random()<.55,patience,preferred,satisfaction:100,reason:''});}
function pick(c){const av=products.map((p,i)=>{const limit=c.type==='Экономный'?1.12:c.type==='Состоятельный'?1.55:c.type==='Семья'?1.3:1.22;const itemPrice=effectivePrice(i)*c.mult;if(s.shelf[i]<=0||c.cart.includes(i)||s.prices[i]/p[2]>limit||itemPrice>c.budget||demand(i)<=.28)return null;let score=demand(i)*70;if(i===c.preferred)score+=26;if(s.promo[i])score+=18;if(s.prices[i]<recPrice(i))score+=10;if(c.type==='Экономный'&&s.prices[i]/supplierCost(i)<2.15)score+=8;if(c.type==='Состоятельный'&&i===3)score+=12;if(c.type==='Семья'&&(i===0||i===1||i===2))score+=10;return {i,score:score*(.85+Math.random()*.3)} }).filter(Boolean).sort((a,b)=>b.score-a.score);return av.length?av[0].i:-1}
function move(c,dt){const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);if(d>1){const speed=(c.state==='exit'||c.state==='pay')?90:62;c.x+=dx/d*speed*dt;c.y+=dy/d*speed*dt}return d}
function moveStaff(w,dt,speed=70){const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy);if(d>1){w.x+=dx/d*speed*dt;w.y+=dy/d*speed*dt}return d}
function staffLevel(k){return Math.max(1,Number(s.staff[k]||0))}function staffSpeed(k){return 1+Math.min(1.2,(staffLevel(k)-1)*.12)}function staffSalary(k){return Math.round((s.staffSalary[k]||0)*(1+Math.max(0,staffLevel(k)-1)*.12))}function addStaffXP(k,n){if(!s.staff[k])return;s.staffXP[k]=(s.staffXP[k]||0)+n;const need=staffLevel(k)*45;if(s.staffXP[k]>=need){s.staffXP[k]-=need;s.staff[k]++;toast('⭐ '+(k==='cashier'?'Кассир':k==='seller'?'Продавец':'Уборщик')+' повышен до '+s.staff[k]+' уровня!')}}function moveStaff(w,dt,speed=70){const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy);if(d>1){w.x+=dx/d*speed*dt;w.y+=dy/d*speed*dt}return d}
function updateStaff(dt){
 const ss=s.staffState;if(!ss)return;
 const seller=ss.seller;
 if(s.staff.seller){
   if(seller.task==='Готов'||seller.task==='Проверяет полки'){
     let low=-1;for(let i=0;i<6;i++){if(s.shelf[i]<=3&&s.warehouse[i]>0){low=i;break}}
     if(low>=0){seller.task='Пополняет '+products[low][0];seller.tx=775;seller.ty=235+Math.floor(low/3)*75;seller.timer=0}
     else{seller.task='Проверяет полки';seller.tx=730;seller.ty=380}
   }else if(moveStaff(seller,dt,58*staffSpeed('seller'))<5){
     seller.timer+=dt;
     if(seller.timer>.5/staffSpeed('seller')){
       const i=products.findIndex(p=>seller.task.includes(p[0]));
       if(i>=0){const n=Math.min(2+Math.floor(staffLevel('seller')/3),s.warehouse[i],12+s.shopUpgrades.shelves*2-s.shelf[i]);if(n){s.warehouse[i]-=n;s.shelf[i]+=n;addStaffXP('seller',3)}}
       seller.timer=0;seller.task='Готов';seller.tx=730;seller.ty=380
     }
   }
 }else seller.task='Не нанят';
 const cashier=ss.cashier;
 if(s.staff.cashier){cashier.task=s.queue.length?'Обслуживает очередь':'Ждёт покупателей';cashier.tx=615;cashier.ty=330;if(moveStaff(cashier,dt,65*staffSpeed('cashier'))<5)cashier.timer+=dt}else cashier.task='Не нанят';

 if(s.staff.cleaner){
   if(cleaner.task==='Не нанят'||cleaner.task==='Готов'){cleaner.task='Убирает магазин';cleaner.tx=70+Math.random()*690;cleaner.ty=190+Math.random()*220;cleaner.timer=0}
   if(moveStaff(cleaner,dt,48*staffSpeed('cleaner'))<5){cleaner.timer+=dt;if(cleaner.timer>1.2/staffSpeed('cleaner')){s.cleanliness=Math.min(100,s.cleanliness+.8);addStaffXP('cleaner',2);cleaner.task='Готов'}}
 }else cleaner.task='Не нанят';
}

function drawChar(c){const colors={Экономный:'#d49b72',Обычный:'#6e8db5',Состоятельный:'#c68f52',Семья:'#8c9d72'};ctx.fillStyle=colors[c.type]||'#789';ctx.beginPath();ctx.arc(c.x,c.y-24,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#334';ctx.fillRect(c.x-8,c.y-15,16,25);ctx.fillStyle='#fff';ctx.fillRect(c.x-7,c.y-7,14,4);if(c.basket){ctx.strokeStyle='#7b4e2f';ctx.lineWidth=3;ctx.strokeRect(c.x+8,c.y+1,12,9)} }
function shelf(x,y,w,h,label,idx){ctx.fillStyle='#f7ead8';ctx.fillRect(x,y,w,h);ctx.fillStyle='#a8734e';ctx.fillRect(x,y,w,7);ctx.fillStyle='#6e5140';ctx.fillRect(x+5,y+12,w-10,6);round(x+12,y-26,w-24,22,8,'#6b5141');txt(label,x+w/2,y-11,11,'#fff','800','center');for(let r=0;r<3;r++){ctx.fillStyle='#d0ae8d';ctx.fillRect(x+8,y+28+r*24,w-16,3);for(let k=0;k<7;k++){const px=x+14+k*20,py=y+10+r*24;ctx.fillStyle=['#e6a85f','#df7b6f','#79a8c4','#d5bd67','#91b879','#bd8ea0'][(idx+r+k)%6];ctx.beginPath();ctx.roundRect(px,py,13,18,3);ctx.fill()}}}

function zoneUnlocked(k){return !!s.zones[k]}
function zoneCost(k){return zoneDefs[k]?.cost||0}
function zoneLabel(k){const z=zoneDefs[k];return zoneUnlocked(k)?'✓ '+z.name:z.name+' • '+money(z.cost)}
function buyZone(k){
  if(zoneUnlocked(k)) return toast(zoneDefs[k].name+' уже открыт');
  const cost=zoneCost(k);
  if(s.money<cost)return toast('Не хватает денег для открытия зоны');
  s.money-=cost;s.dayExpenses+=cost;s.zones[k]=1;
  if(k==='storage')s.warehouseCap+=90;
  if(k==='bakery')s.departments.push('Пекарня');
  if(k==='coffee')s.departments.push('Кофейная зона');
  if(k==='produce')s.departments.push('Овощи и фрукты');
  s.reputation=Math.min(5,s.reputation+.08);
  save();renderHUD();renderRight();openPanel('dev');toast('🎉 Открыта зона: '+zoneDefs[k].name);
}
function drawZone(k){
  const z=zoneDefs[k], unlocked=zoneUnlocked(k);
  round(z.x,z.y,z.w,z.h,10,unlocked?z.color:'#5f5148');
  ctx.strokeStyle=unlocked?'#f7d49a':'#d2bca5';ctx.lineWidth=2;ctx.strokeRect(z.x+1,z.y+1,z.w-2,z.h-2);
  txt(unlocked?'✓ '+z.name:'🔒 '+z.name,z.x+z.w/2,z.y+25,12,'#fff','800','center');
  txt(unlocked?z.desc:'Открыть за '+money(z.cost),z.x+z.w/2,z.y+44,9,unlocked?'#fff3d5':'#ead7c0','600','center');
}
function handleCanvasTap(e){
  const r=canvas.getBoundingClientRect(),sc=Math.min(W/900,H/600),ox=(W-900*sc)/2,oy=48;
  const x=(e.clientX-r.left-ox)/sc,y=(e.clientY-r.top-oy)/sc;
  for(const k of Object.keys(zoneDefs)){const z=zoneDefs[k];if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h){if(!zoneUnlocked(k))buyZone(k);else toast(z.name+' уже работает');return}}
}

function equipCount(k){return Number(s.equipment[k]||0)}
function buyEquipment(k){
  const d=equipmentDefs[k];
  if(!d)return;
  if(k!=='checkout' && !zoneUnlocked(d.zone))return toast('Сначала откройте зону: '+zoneDefs[d.zone].name);
  if(k!=='checkout'){
    if(s.money<d.cost)return toast('Не хватает денег');
    s.money-=d.cost;s.dayExpenses+=d.cost;s.equipment[k]++;
  }
  const idx=s.placed.length;
  const spots={
    checkout:[575,330],shelf:[105,220],fridge:[405,220],bakeryOven:[115,455],
    coffeeMachine:[330,455],produceRack:[545,455]
  };
  const base=spots[k]||[180+idx*22,240];
  s.placed.push({id:Date.now()+Math.random(),type:k,x:base[0]+(equipCount(k)-1)*18,y:base[1]+(equipCount(k)-1)*8});
  save();renderHUD();openPanel('builder');toast(d.icon+' '+d.name+' установлен');
}
function removeEquipment(id){
  const item=s.placed.find(x=>x.id===id);if(!item)return;
  if(item.type!=='checkout'){s.equipment[item.type]=Math.max(0,equipCount(item.type)-1);s.money+=Math.round(equipmentDefs[item.type].cost*.5)}
  s.placed=s.placed.filter(x=>x.id!==id);save();openPanel('builder');toast('Оборудование убрано');
}
function drawEquipment(){
  for(const p of s.placed){
    const d=equipmentDefs[p.type];if(!d)continue;
    round(p.x,p.y,d.w,d.h,8,p.type==='checkout'?'#79513d':p.type==='fridge'?'#78a8bd':p.type==='shelf'?'#a8734e':'#8a6a54');
    txt(d.icon,p.x+d.w/2,p.y+20,18,'#fff','800','center');
    txt(d.name,p.x+d.w/2,p.y+d.h-7,8,'#fff','800','center');
  }
}
function openBuilder(){openPanel('builder')}
function placeFromMap(type){
  if(type==='checkout' || equipCount(type)>0){buyEquipment(type);return}
  buyEquipment(type);
}


const departmentDefs={
 bakery:{name:'Пекарня',icon:'🥐',zone:'bakery',product:0,equipment:'bakeryOven',baseRate:10,salary:650,desc:'Производит хлеб каждые 10 сек.'},
 coffee:{name:'Кофейня',icon:'☕',zone:'coffee',product:3,equipment:'coffeeMachine',baseRate:12,salary:750,desc:'Производит кофе каждые 12 сек.'},
 produce:{name:'Овощи и фрукты',icon:'🥬',zone:'produce',product:2,equipment:'produceRack',baseRate:9,salary:600,desc:'Производит яйца каждые 9 сек.'}
};
function departmentLevel(k){return Math.max(1,Number(s.departmentStaff[k]||0))}
function departmentSalary(k){return s.departmentStaff[k]?Math.round(departmentDefs[k].salary*(1+(departmentLevel(k)-1)*.1)):0}
function hireDepartmentStaff(k){
  const d=departmentDefs[k];if(!zoneUnlocked(d.zone))return toast('Сначала откройте '+d.name);
  const cost=3500*departmentLevel(k);
  if(s.money<cost)return toast('Не хватает денег');
  s.money-=cost;s.dayExpenses+=cost;s.departmentStaff[k]=departmentLevel(k)+1;s.departmentXP[k]=0;
  save();openPanel('staff');toast(d.icon+' Сотрудник отдела нанят');
}
function produceDepartments(dt){
  if(!s.productionTimers)s.productionTimers={bakery:0,coffee:0,produce:0};
  for(const [k,d] of Object.entries(departmentDefs)){
    if(!zoneUnlocked(d.zone)||!equipCount(d.equipment)||!s.departmentStaff[k])continue;
    s.productionTimers[k]=(s.productionTimers[k]||0)+dt;
    const interval=Math.max(4,d.baseRate/departmentLevel(k));
    if(s.productionTimers[k]>=interval){
      s.productionTimers[k]-=interval;
      const free=Math.max(0,s.warehouseCap-s.warehouse.reduce((a,b)=>a+b,0));
      if(free>0){
        const qty=Math.min(1+Math.floor((departmentLevel(k)-1)/2),free);
        s.warehouse[d.product]+=qty;
        s.production[k]=(s.production[k]||0)+qty;
        s.departmentXP[k]=(s.departmentXP[k]||0)+qty*2;
        const need=departmentLevel(k)*35;
        if(s.departmentXP[k]>=need){s.departmentXP[k]-=need;s.departmentStaff[k]++;toast('⭐ '+d.name+' повысил уровень до '+s.departmentStaff[k])}
      }
    }
  }
}
let lastFrame=performance.now(),spawnClock=0,renderClock=0,productionClock=0;
function processCustomer(c,dt){
  c.wait=(c.wait||0)+dt;
  if(c.state==='enter'){
    if(move(c,dt)<5){c.state='shop';c.tx=190+Math.random()*420;c.ty=260+Math.random()*135;c.wait=0}
  }else if(c.state==='shop'){
    if(c.cart.length<Math.min(c.target,3)){
      const p=pick(c);
      if(p>=0){
        s.shelf[p]--;c.cart.push(p);c.prod=p;c.state='inspect';c.tx=190+Math.random()*420;c.ty=255+Math.random()*135;c.wait=0;
      }else{
        c.satisfaction=Math.max(0,c.satisfaction-8);c.reason='Нет подходящего товара';
        c.state='exit';c.tx=40;c.ty=410;
      }
    }else{c.state='queue';c.tx=520;c.ty=435+s.queue.length*14;c.wait=0;s.queue.push(c.id)}
  }else if(c.state==='inspect'){
    if(c.wait>.45){c.state='shop';c.wait=0}
  }else if(c.state==='queue'){
    const pos=s.queue.indexOf(c.id);
    if(pos<0){c.state='exit';c.tx=40;c.ty=410}
    else{c.tx=515;c.ty=435+pos*14;c.satisfaction=Math.max(0,c.satisfaction-(dt*.08));if(c.wait>c.patience){s.queue.splice(pos,1);c.satisfaction-=18;c.reason='Слишком долго ждал';s.complaints++;s.reputation=Math.max(1,s.reputation-.02);c.state='exit';c.tx=40;c.ty=410}}
  }else if(c.state==='pay'){
    if(c.wait>1.5/staffSpeed('cashier')){
      const total=c.cart.reduce((a,i)=>a+effectivePrice(i),0);
      s.money+=total;s.dayRevenue+=total;s.daySales++;s.sales++;s.avgCheck=s.daySales?Math.round(s.dayRevenue/s.daySales):0;
      c.satisfaction=Math.max(0,c.satisfaction-(s.cleanliness<70?8:0));
      if(c.satisfaction<55){s.complaints++;s.reputation=Math.max(1,s.reputation-.03)}
      s.salesByProduct.forEach(()=>{});c.cart.forEach(i=>s.salesByProduct[i]++);
      addStaffXP('cashier',4);c.state='exit';c.tx=40;c.ty=410;c.wait=0;
    }
  }else if(c.state==='exit'){if(move(c,dt)>5)return 'keep';return 'done'}
  return 'keep';
}
function update(now){
  const dt=Math.min(.1,Math.max(.001,(now-lastFrame)/1000));lastFrame=now;
  if(s.paused){requestAnimationFrame(update);return;}
  spawnClock+=dt;renderClock+=dt;
  if(spawnClock>Math.max(1.7,3.8-s.shopLevel*.18-s.ads*.08)){spawnClock=0;spawn()}
  if(s.deliveries.length){
    s.deliveries[0].time-=dt;
    if(s.deliveries[0].time<=0){
      const d=s.deliveries.shift(),free=Math.max(0,s.warehouseCap-s.warehouse.reduce((a,b)=>a+b,0));
      let added=0;d.qty.forEach((n,i)=>{const q=Math.min(n,Math.max(0,free-added));s.warehouse[i]+=q;added+=q});
      toast('📦 Поставка прибыла: '+added+' шт.');
    }
  }
  produceDepartments(dt);updateStaff(dt);
  for(let i=s.customers.length-1;i>=0;i--){
    const c=s.customers[i];
    if(c.state==='queue'&&s.queue[0]===c.id&&!c._processing){c._processing=true;c.state='pay';c.wait=0;s.queue.shift()}
    const r=processCustomer(c,dt);
    if(r==='done')s.customers.splice(i,1);
  }
  if(renderClock>.8){renderClock=0;renderHUD();renderRight();save()}
  draw();
  requestAnimationFrame(update);
}

function renderHUD(){document.getElementById('money').textContent=money(s.money);document.getElementById('rep').textContent=s.reputation.toFixed(1).replace('.',',');document.getElementById('vis').textContent=s.visitors;document.getElementById('day').textContent='День '+s.day;document.getElementById('xp').textContent=Math.min(7200,5340+s.sales*8).toLocaleString('ru-RU');document.getElementById('xpbar').style.width=Math.min(100,(5340+s.sales*8)/72)+'%'}
function renderRight(){const profit=s.dayRevenue-s.dayExpenses;document.getElementById('right').innerHTML='<div class="card"><h3>📊 Сегодня</h3><div class="line"><span>Выручка</span><b class="green">'+money(s.dayRevenue)+'</b></div><div class="line"><span>Расходы</span><b class="red">− '+money(s.dayExpenses)+'</b></div><div class="line"><span>Прибыль</span><b class="green">'+money(profit)+'</b></div><div class="line"><span>Посетители</span><b>'+s.dayVisitors+'</b></div><div class="line"><span>Продажи</span><b>'+s.daySales+'</b></div></div><div class="card"><h3>🏆 Топ товаров</h3>'+products.map((p,i)=>({p,i,v:s.salesByProduct[i]})).sort((a,b)=>b.v-a.v).slice(0,3).map((x,n)=>'<div class="line"><span>'+(n+1)+'. '+x.p[0]+'</span><b>'+x.v+'</b></div>').join('')+'</div><div class="card promo"><h3>🏷️ Акция</h3><div>Скидка 10% помогает ускорить спрос.</div><button onclick="togglePromo(0)">'+(s.promo[0]?'Отключить скидку':'Включить скидку на хлеб')+'</button></div>'}
function openPanel(id){const p=document.getElementById('panel');if(id==='shop'){p.classList.remove('open');s.paused=false;return}s.paused=true;p.classList.add('open');let html='';if(id==='city')html=renderCityPanel();else if(id==='analytics')html='<h2>📊 Аналитика</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Продано: '+s.salesByProduct[i]+'<br>Спрос: '+Math.round(demand(i)*100)+'%<br>Цена: '+money(effectivePrice(i))+'<br>Закупка: '+money(supplierCost(i))+'</small></div>').join('')+'</div><div class="item" style="margin-top:8px"><b>🏭 Производство</b><small>🥐 Хлеб: '+(s.production.bakery||0)+' • ☕ Кофе: '+(s.production.coffee||0)+' • 🥚 Яйца: '+(s.production.produce||0)+'</small></div>';else if(id==='procurement')html='<h2>🚚 Поставщики</h2><div class="grid">'+Object.entries(suppliers).map(([k,v])=>'<div class="item"><b>'+v.name+'</b><small>×'+v.mult.toFixed(2)+' • '+v.time+' сек.<br>'+v.desc+'</small><button onclick="chooseSupplier(\''+k+'\')">'+(s.supplier===k?'Выбран':'Выбрать')+'</button></div>').join('')+'</div><button style="margin-top:10px;background:#6e5140;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800" onclick="order()">🚚 Заказать 48 шт.</button>';else if(id==='stock')html='<h2>📦 Склад</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>На полке: '+s.shelf[i]+'<br>На складе: '+s.warehouse[i]+'</small><button onclick="restockOne('+i+')">Выложить 3 шт.</button></div>').join('')+'</div>';else if(id==='staff')html='<h2>👥 Персонал</h2><div class="grid"><div class="item"><b>Кассир • уровень '+s.staff.cashier+'</b><small>Обслуживает очередь • XP '+s.staffXP.cashier+'</small><button onclick="upgradeStaff(\'cashier\')">Улучшить за '+money(2500*s.staff.cashier)+'</button></div><div class="item"><b>Продавец • уровень '+s.staff.seller+'</b><small>Пополняет основные полки • XP '+s.staffXP.seller+'</small><button onclick="upgradeStaff(\'seller\')">Улучшить за '+money(2500*s.staff.seller)+'</button></div><div class="item"><b>Уборщик</b><small>Чистота магазина • зарплата '+money(staffSalary('cleaner'))+'</small><button onclick="hireCleaner()">'+(s.staff.cleaner?'Уже нанят':'Нанять за 3 000 ₽')+'</button></div>'+Object.entries(departmentDefs).map(([k,d])=>'<div class="item"><b>'+d.icon+' '+d.name+' • уровень '+departmentLevel(k)+'</b><small>'+d.desc+'<br>Зарплата: '+money(departmentSalary(k))+'</small><button onclick="hireDepartmentStaff(\''+k+'\')">'+(s.departmentStaff[k]?'Повысить уровень':'Нанять за '+money(3500*departmentLevel(k)))+'</button></div>').join('')+'</div>';else if(id==='marketing')html='<h2>🏷️ Маркетинг</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Спрос '+Math.round(demand(i)*100)+'%</small><button onclick="togglePromo('+i+')">'+(s.promo[i]?'Скидка 10%':'Запустить скидку 10%')+'</button></div>').join('')+'</div>';else if(id==='dev')html='<h2>📈 Развитие</h2><div class="grid"><div class="item"><b>🏪 Расширение магазина</b><small>Уровень '+s.shopLevel+' • склад '+s.warehouseCap+' шт.</small><button onclick="expand()">Расширить за '+money(12000*(s.expanded+1))+'</button></div><div class="item"><b>💳 Кассовая зона</b><small>Ускоряет обслуживание очереди. Уровень '+s.shopUpgrades.checkout+'</small><button onclick="upgradeShop(\'checkout\')">Улучшить за '+money(5000*(s.shopUpgrades.checkout+1))+'</button></div><div class="item"><b>🗄️ Стеллажи</b><small>Вместимость полок +2 за уровень. Уровень '+s.shopUpgrades.shelves+'</small><button onclick="upgradeShop(\'shelves\')">Улучшить за '+money(4500*(s.shopUpgrades.shelves+1))+'</button></div><div class="item"><b>📦 Склад</b><small>Вместимость +30 за уровень. Уровень '+s.shopUpgrades.warehouse+'</small><button onclick="upgradeShop(\'warehouse\')">Улучшить за '+money(6000*(s.shopUpgrades.warehouse+1))+'</button></div><div class="item"><b>💡 Освещение</b><small>Повышает впечатление покупателей. Уровень '+s.shopUpgrades.lighting+'</small><button onclick="upgradeShop(\'lighting\')">Улучшить за '+money(3500*(s.shopUpgrades.lighting+1))+'</button></div><div class="item"><b>📣 Реклама</b><small>Больше посетителей и репутации.</small><button onclick="advertise()">Запустить за '+money(3000*(s.ads+1))+'</button></div><div class="item"><b>🗺️ Карта магазина</b><small>Открывайте отделы внутри магазина.</small><button onclick="openPanel('map')">Открыть карту</button></div><div class="item"><b>🏙️ Город и сеть</b><small>Локации, конкуренты и второй магазин.</small><button onclick="openPanel('city')">Открыть город</button></div><div class="item"><b>🛠️ Конструктор</b><small>Покупайте оборудование и размещайте его в магазине.</small><button onclick="openPanel('builder')">Открыть конструктор</button></div></div>';else if(id==='builder')html='<h2>🛠️ Конструктор магазина</h2><div class="grid">'+Object.entries(equipmentDefs).map(([k,d])=>'<div class="item"><b>'+d.icon+' '+d.name+'</b><small>'+d.desc+'<br>Установлено: '+equipCount(k)+(d.cost?' • Цена: '+money(d.cost):'')+'</small><button onclick="buyEquipment(' + "'" + k + "'" + ')">'+(k==='checkout'?'Установить':'Купить и установить')+'</button></div>').join('')+'</div><div class="item" style="margin-top:8px"><b>📍 Установленное оборудование</b><small>'+s.placed.map(p=>equipmentDefs[p.type]?.icon+' '+equipmentDefs[p.type]?.name).join(' • ')+'</small></div>';else if(id==='map')html='<h2>🗺️ Карта магазина</h2><div class="grid">'+Object.entries(zoneDefs).map(([k,z])=>'<div class="item"><b>'+z.name+'</b><small>'+z.desc+'</small><button onclick="buyZone(' + "'" + k + "'" + ')">'+(zoneUnlocked(k)?'✓ Открыто':'Открыть за '+money(z.cost))+'</button></div>').join('')+'</div><div class="item" style="margin-top:8px"><b>Открытые отделы</b><small>'+s.departments.join(' • ')+'</small></div>';else if(id==='prices')html='<h2>💰 Цены</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Текущая: '+money(s.prices[i])+'<br>Рекомендованная: '+money(recPrice(i))+'</small><button onclick="setPrice('+i+')">Поставить рекомендуемую</button></div>').join('')+'</div>';else if(id==='settings')html='<h2>⚙️ Настройки</h2><div class="grid"><div class="item"><b>Сохранение</b><small>Прогресс хранится на этом устройстве в localStorage.</small><button onclick="saveNow()">💾 Сохранить сейчас</button></div><div class="item"><b>Новый тест</b><small>Полностью сбросит текущий прогресс и начнёт игру заново.</small><button onclick="resetGame()">↻ Сбросить прогресс</button></div><div class="item"><b>V32 CITY & CHAIN</b><small>Персонал теперь физически работает в магазине: кассир обслуживает очередь, продавец пополняет полки, уборщик перемещается по залу.</small></div><div class="item"><b>Текущий день</b><small>День '+s.day+' • Выручка '+money(s.dayRevenue)+' • Продажи '+s.daySales+'</small><button onclick="endDay()">🌙 Завершить день</button></div></div>';else if(id==='products')html='<h2>🛒 Товары</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Продано: '+s.salesByProduct[i]+' • спрос '+Math.round(demand(i)*100)+'%</small><button onclick="setPrice('+i+')">Настроить цену</button></div>').join('')+'</div>';p.innerHTML=html}
function chooseSupplier(k){s.supplier=k;save();openPanel('procurement');toast(suppliers[k].name+' выбран')}function order(){if(s.deliveries.length)return toast('Поставка уже в пути');const totalStock=s.warehouse.reduce((a,b)=>a+b,0);const free=Math.max(0,s.warehouseCap-totalStock);if(free<24)return toast('На складе мало места');const per=Math.max(4,Math.floor(Math.min(48,free)/6));const qty=products.map(()=>per);const cost=qty.reduce((a,n,i)=>a+n*supplierCost(i),0)+(suppliers[s.supplier]||suppliers.standard).fee;if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.dayExpenses+=cost;s.deliveries.push({time:suppliers[s.supplier].time,qty});s.orders++;save();toast('Грузовик отправлен 🚚')}function restockOne(i){const n=Math.min(3,s.warehouse[i],12-s.shelf[i]);if(n){s.warehouse[i]-=n;s.shelf[i]+=n;save();toast('Товар выложен на полку')}}function togglePromo(i){s.promo[i]=s.promo[i]?0:10;save();renderRight();toast(s.promo[i]?'Скидка 10% включена':'Скидка отключена');openPanel('marketing')}function setPrice(i){const r=recPrice(i);s.prices[i]=r;save();toast('Цена установлена: '+money(r));openPanel('prices')}function upgradeShop(k){const costs={checkout:5000,shelves:4500,warehouse:6000,lighting:3500};const cost=costs[k]*(s.shopUpgrades[k]+1);if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.dayExpenses+=cost;s.shopUpgrades[k]++;if(k==='warehouse')s.warehouseCap+=30;if(k==='shelves'){s.shelf=s.shelf.map(v=>v+2)}if(k==='lighting')s.reputation=Math.min(5,s.reputation+.05);save();toast('Улучшение куплено');openPanel('dev')}function upgradeStaff(k){const cost=2500*s.staff[k];if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.dayExpenses+=cost;s.staff[k]++;s.staffXP[k]=0;save();toast('Персонал повышен до '+s.staff[k]+' уровня');openPanel('staff')}function hireCleaner(){if(s.staff.cleaner)return; if(s.money<3000)return toast('Не хватает денег');s.money-=3000;s.staff.cleaner=1;s.staffXP.cleaner=0;s.staffSalary.cleaner=350;save();openPanel('staff')}function expand(){const cost=12000*(s.expanded+1);if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.expanded++;s.shopLevel++;s.warehouseCap+=30;s.warehouse=s.warehouse.map(x=>x+3);s.shelf=s.shelf.map(x=>x+2);s.dailyGoal+=900;save();toast('Магазин расширен')}function advertise(){const cost=3000*(s.ads+1);if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.dayExpenses+=cost;s.ads++;s.reputation=Math.min(5,s.reputation+.08);save();toast('Реклама запущена')}function saveNow(){save();toast('Прогресс сохранён 💾')}function resetGame(){if(!confirm('Сбросить весь прогресс?'))return;localStorage.removeItem('myshop_v32');localStorage.removeItem('myshop_v31');localStorage.removeItem('myshop_v30');localStorage.removeItem('myshop_v29');localStorage.removeItem('myshop_v28');localStorage.removeItem('myshop_v25');localStorage.removeItem('myshop_v23');s=Object.assign({},defaults);s.zones={front:1,storage:0,bakery:0,coffee:0,produce:0};s.equipment=Object.assign({},defaults.equipment||{checkout:1,shelf:3,fridge:0,bakeryOven:0,coffeeMachine:0,produceRack:0});s.placed=[{id:'checkout-main',type:'checkout',x:575,y:330}];s.departmentStaff={bakery:0,coffee:0,produce:0};s.departmentXP={bakery:0,coffee:0,produce:0};s.production={bakery:0,coffee:0,produce:0};s.productionTimers={bakery:0,coffee:0,produce:0};s.zoneWorkers={bakery:0,coffee:0,produce:0};s.city={location:'center',unlockedLocations:['center'],secondStore:null,activeStore:0,competitors:[{name:'Семейный Маркет',strength:3,price:1.02,traffic:1.08},{name:'У дома',strength:2,price:.94,traffic:.92},{name:'Гастроном №1',strength:4,price:1.08,traffic:1.15}]};s.departments=['Основной зал'];s.staff=Object.assign({},defaults.staff);s.staffState=JSON.parse(JSON.stringify(defaults.staffState));s.warehouse=defaults.warehouse.slice();s.shelf=defaults.shelf.slice();s.prices=defaults.prices.slice();s.salesByProduct=defaults.salesByProduct.slice();s.purchaseCosts=defaults.purchaseCosts.slice();s.costTrend=defaults.costTrend.slice();s.promo=defaults.promo.slice();s.customers=[];s.queue=[];s.deliveries=[];save();renderHUD();renderRight();openPanel('shop');toast('Новый тестовый запуск 🚀')}function dailyEvent(){const r=Math.random();if(r<.18){const i=Math.floor(Math.random()*6);s.costTrend[i]=Math.max(-8,Math.min(18,(s.costTrend[i]||0)+5));s.lastEvent='Поставщик поднял цену на '+products[i][0];toast('📈 '+s.lastEvent)}else if(r<.32){const i=Math.floor(Math.random()*6);s.costTrend[i]=Math.max(-8,(s.costTrend[i]||0)-5);s.lastEvent='Выгодная закупка: '+products[i][0];toast('📉 '+s.lastEvent)}else if(r<.42){s.lastEvent='Выходной: покупателей сегодня больше';s.dailyGoal=Math.round(s.dailyGoal*.92);toast('👥 Сегодня ожидается больше покупателей')}else{s.lastEvent='Обычный торговый день'}}function endDay(){const secondProfit=secondStoreDaily();const goalBonus=s.dayRevenue>=s.dailyGoal?Math.round(s.dailyGoal*.08):0;if(goalBonus){s.money+=goalBonus}const fixed=1200+staffSalary('cashier')+staffSalary('seller')+(s.staff.cleaner?staffSalary('cleaner'):0)+Object.keys(departmentDefs).reduce((a,k)=>a+departmentSalary(k),0);s.money-=fixed;s.dayExpenses+=fixed;s.dailyHistory.push({day:s.day,revenue:s.dayRevenue,expenses:s.dayExpenses,profit:s.dayRevenue-s.dayExpenses,sales:s.daySales,visitors:s.dayVisitors,secondStoreProfit:secondProfit});s.day++;dailyEvent();s.dayRevenue=0;s.dayExpenses=0;s.daySales=0;s.dayVisitors=0;s.queue=[];s.customers=[];s.deliveries=[];s.reputation=Math.max(1,Math.min(5,s.reputation+(s.complaints?-.02:.01)+(s.cleanliness>90?.005:-.005)));s.cleanliness=Math.max(45,s.cleanliness-(s.dayVisitors*.035));s.complaints=0;s.dailyGoal=Math.round(s.dailyGoal*1.04);s.events=[];save();toast(goalBonus?'Цель выполнена! Бонус '+money(goalBonus)+' 🎉':'Начался день '+s.day);renderRight()}
addEventListener('keydown',e=>{if(e.key==='Escape')openPanel('shop');if(e.key.toLowerCase()==='s')saveNow();if(e.key.toLowerCase()==='d')endDay()});for(const b of [...document.querySelectorAll('[data-panel]')])b.addEventListener('click',()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('[data-panel="'+b.dataset.panel+'"]').forEach(x=>x.classList.add('active'));openPanel(b.dataset.panel)});renderHUD();renderRight();requestAnimationFrame(update);setInterval(save,5000);
</script></body></html>
