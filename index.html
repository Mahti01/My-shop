<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const products=[['Хлеб',45,69,'🥖'],['Молоко',55,89,'🥛'],['Яйца',80,119,'🥚'],['Кофе',180,299,'☕'],['Шоколад',70,129,'🍫'],['Вода',30,59,'💧']];
const types=[['Экономный',.75,35,.68,2],['Обычный',1,50,.88,3],['Состоятельный',1.25,70,.98,2],['Семья',1.1,90,.92,3]];
const defaults={day:1,money:50000,reputation:4.5,warehouse:[15,15,15,15,15,15],shelf:[8,8,8,8,8,8],prices:products.map(p=>p[2]),customers:[],queue:[],deliveries:[],staff:{cashier:1,seller:1,cleaner:0},sales:0,visitors:0,dayRevenue:0,dayExpenses:0,daySales:0,dayVisitors:0,expanded:0,ads:0,complaints:0,salesByProduct:[0,0,0,0,0,0],dailyHistory:[],purchaseCosts:products.map(p=>p[1]),costTrend:products.map(()=>0),supplier:'standard',promo:[0,0,0,0,0,0],paused:false,warehouseCap:120,shopLevel:1,dailyGoal:3500,events:[],lastEvent:'',orders:0,stockouts:0,avgCheck:0};
let s=load();function load(){try{const old=JSON.parse(localStorage.getItem('myshop_v26')||localStorage.getItem('myshop_v25')||localStorage.getItem('myshop_v23')||'null');const x=Object.assign({},defaults,old||{});x.staff=Object.assign({},defaults.staff,old?.staff||{});x.warehouse=(old?.warehouse?.length===6?old.warehouse:defaults.warehouse.slice());x.shelf=(old?.shelf?.length===6?old.shelf:defaults.shelf.slice());x.prices=old?.prices?.length===6?old.prices.slice():defaults.prices.slice();x.salesByProduct=old?.salesByProduct?.length===6?old.salesByProduct.slice():defaults.salesByProduct.slice();x.purchaseCosts=old?.purchaseCosts?.length===6?old.purchaseCosts.slice():defaults.purchaseCosts.slice();x.costTrend=old?.costTrend?.length===6?old.costTrend.slice():defaults.costTrend.slice();x.promo=old?.promo?.length===6?old.promo.slice():defaults.promo.slice();x.warehouseCap=Number(old?.warehouseCap||120);x.shopLevel=Number(old?.shopLevel||1);x.dailyGoal=Number(old?.dailyGoal||3500);x.events=Array.isArray(old?.events)?old.events:[];x.orders=Number(old?.orders||0);x.stockouts=Number(old?.stockouts||0);x.avgCheck=Number(old?.avgCheck||0);return x}catch(e){return Object.assign({},defaults)}}function save(){localStorage.setItem('myshop_v26',JSON.stringify(s))}function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1600)}
const suppliers={fast:{name:'Быстрый',mult:1.12,time:4,fee:650,desc:'Дороже, но товар приходит быстро.'},standard:{name:'Стандарт',mult:1,time:7,fee:900,desc:'Баланс цены и скорости.'},bulk:{name:'Опт',mult:.88,time:11,fee:1300,desc:'Дешевле, но доставка дольше.'}};
function supplierCost(i){const sp=suppliers[s.supplier]||suppliers.standard;return Math.round(products[i][1]*sp.mult*(1+(s.costTrend[i]||0)/100))}function effectivePrice(i){return Math.max(1,Math.round(s.prices[i]*(1-(s.promo[i]||0)/100)))}function demand(i){const base=[1.05,.95,.85,.72,.9,1.1][i];const market=products[i][2];const priceRatio=s.prices[i]/market;const pricePenalty=priceRatio<=1?1+Math.min(.18,(1-priceRatio)*.45):Math.max(.35,1-(priceRatio-1)*1.05);const stock=s.shelf[i]>0?1:(s.warehouse[i]>0?.45:0);const promoBoost=s.promo[i]?1.22:1;return Math.max(0,Math.min(1.45,base*pricePenalty*promoBoost*stock))}function recPrice(i){return Math.max(products[i][1]+5,Math.round(supplierCost(i)*2.05*(demand(i)>.95?1.04:.96)))}
function spawn(){if(s.paused||s.customers.length>=11)return;const available=products.map((p,i)=>s.shelf[i]>0?i:-1).filter(i=>i>=0);if(!available.length)return;const t=types[Math.floor(Math.random()*types.length)];const prod=available[Math.floor(Math.random()*available.length)];s.visitors++;s.dayVisitors++;s.customers.push({id:Math.random(),x:65,y:390,tx:190+Math.random()*240,ty:300+Math.random()*110,state:'enter',type:t[0],mult:t[1],budget:t[2],accept:t[3],target:t[4],prod,cart:[],wait:0,anim:0,basket:Math.random()<.55});}
function pick(c){const av=products.map((p,i)=>{const limit=c.type==='Экономный'?1.12:c.type==='Состоятельный'?1.55:c.type==='Семья'?1.3:1.22;const itemPrice=effectivePrice(i)*c.mult;return s.shelf[i]>0&&!c.cart.includes(i)&&s.prices[i]/p[2]<=limit&&itemPrice<=c.budget&&demand(i)>.28?i:-1}).filter(i=>i>=0);return av.length?av[Math.floor(Math.random()*av.length)]:-1}
function move(c,dt){const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);if(d>1){const speed=(c.state==='exit'||c.state==='pay')?90:62;c.x+=dx/d*speed*dt;c.y+=dy/d*speed*dt}return d}
function chooseNext(c){if(c.cart.length>=Math.min(3,c.target)||Math.random()<.22){c.state='queue';c.wait=0;s.queue.push(c);return}const p=pick(c);if(p<0){c.state='queue';c.wait=0;s.queue.push(c);return}c.prod=p;c.state='shelf';c.tx=280+(p%3)*105;c.ty=250+Math.floor(p/3)*75;c.wait=0}
function update(dt){if(!s.paused){if(!window.spawnT)window.spawnT=0;window.spawnT+=dt;if(window.spawnT>2.8){window.spawnT=0;spawn()}for(const c of s.customers){c.anim+=dt*8;if(c.state==='enter'&&move(c,dt)<5){c.state='shelf';c.tx=280+(c.prod%3)*105;c.ty=250+Math.floor(c.prod/3)*75}else if(c.state==='shelf'&&move(c,dt)<5){c.state='inspect';c.wait=0}else if(c.state==='inspect'){c.wait+=dt;if(c.wait>.55){if(s.shelf[c.prod]<=0){s.stockouts++;chooseNext(c)}else{s.shelf[c.prod]--;c.cart.push(c.prod);chooseNext(c)}}}else if(c.state==='queue'){const q=s.queue.indexOf(c);c.tx=540+q*32;c.ty=390;c.wait+=dt;if(q===0&&c.wait>.7){c.state='serve';c.wait=0}}else if(c.state==='serve'){c.wait+=dt;if(c.wait>Math.max(.8,1.7-.2*s.staff.cashier)){const idx=s.queue.indexOf(c);if(idx===0){s.queue.shift();const total=c.cart.reduce((a,i)=>a+effectivePrice(i)*c.mult,0);if(total>c.budget){c.cart=c.cart.slice(0,1)}const finalTotal=c.cart.reduce((a,i)=>a+effectivePrice(i)*c.mult,0);s.money+=finalTotal;s.dayRevenue+=finalTotal;s.daySales+=c.cart.length;s.sales+=c.cart.length;s.avgCheck=s.sales?s.dayRevenue/s.daySales:0;c.state='pay';c.tx=650;c.ty=350;c.wait=0;for(const i of c.cart)s.salesByProduct[i]++;}}}else if(c.state==='pay'&&move(c,dt)<5){c.state='exit';c.tx=820;c.ty=300}else if(c.state==='exit'){move(c,dt)}}s.customers=s.customers.filter(c=>!(c.state==='exit'&&c.x>790));for(const d of s.deliveries){d.time-=dt;if(d.time<=0){d.qty.forEach((n,i)=>s.warehouse[i]+=n);d.done=true;toast('Поставка прибыла 📦')}}s.deliveries=s.deliveries.filter(d=>!d.done);if(s.staff.seller){for(let i=0;i<6;i++){const n=Math.min(2,s.warehouse[i],12-s.shelf[i]);s.warehouse[i]-=n;s.shelf[i]+=n}}}renderHUD();renderRight();draw();requestAnimationFrame(update)}
function drawChar(c){const colors={Экономный:'#d49b72',Обычный:'#6e8db5',Состоятельный:'#c68f52',Семья:'#8c9d72'};ctx.fillStyle=colors[c.type]||'#789';ctx.beginPath();ctx.arc(c.x,c.y-24,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#334';ctx.fillRect(c.x-8,c.y-15,16,25);ctx.fillStyle='#fff';ctx.fillRect(c.x-7,c.y-7,14,4);if(c.basket){ctx.strokeStyle='#7b4e2f';ctx.lineWidth=3;ctx.strokeRect(c.x+8,c.y+1,12,9)} }
function shelf(x,y,w,h,label,idx){ctx.fillStyle='#f7ead8';ctx.fillRect(x,y,w,h);ctx.fillStyle='#a8734e';ctx.fillRect(x,y,w,7);ctx.fillStyle='#6e5140';ctx.fillRect(x+5,y+12,w-10,6);round(x+12,y-26,w-24,22,8,'#6b5141');txt(label,x+w/2,y-11,11,'#fff','800','center');for(let r=0;r<3;r++){ctx.fillStyle='#d0ae8d';ctx.fillRect(x+8,y+28+r*24,w-16,3);for(let k=0;k<7;k++){const px=x+14+k*20,py=y+10+r*24;ctx.fillStyle=['#e6a85f','#df7b6f','#79a8c4','#d5bd67','#91b879','#bd8ea0'][(idx+r+k)%6];ctx.beginPath();ctx.roundRect(px,py,13,18,3);ctx.fill()}}}
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function txt(t,x,y,size,color='#3b3028',weight='600',align='left'){ctx.fillStyle=color;ctx.font=weight+' '+size+'px Arial';ctx.textAlign=align;ctx.fillText(t,x,y)}
function plant(x,y){round(x-16,y,32,27,7,'#d8c4a9');ctx.fillStyle='#6d9d61';for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(x+(i%2?7:-7),y-8-i*2,9-i*.7,17-i,0,0,Math.PI*2);ctx.fill()}}
function draw(){ctx.clearRect(0,0,W,H);const sc=Math.min(W/900,H/600),ox=(W-900*sc)/2,oy=48;ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);ctx.fillStyle='#b8d2dc';ctx.fillRect(0,0,900,545);ctx.fillStyle='#d8c6ad';ctx.fillRect(0,320,900,225);ctx.fillStyle='#8db6c5';for(let x=15;x<890;x+=105)ctx.fillRect(x,52,88,135);ctx.fillStyle='#d9c5b1';ctx.fillRect(52,70,700,250);ctx.fillStyle='#7b5745';ctx.fillRect(250,82,250,88);for(let x=255;x<495;x+=12){ctx.fillStyle='#ffffff12';ctx.fillRect(x,82,5,88)}txt('🛒',275,128,31,'#f5d486');txt('Мой магазин',315,128,25,'#fff4dc','800');txt('свежие товары каждый день',317,150,10,'#ead6bc');for(let x=160;x<760;x+=180){ctx.fillStyle='#40352e';ctx.fillRect(x,40,5,27);ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.ellipse(x+2,72,22,7,0,0,Math.PI*2);ctx.fill()}shelf(88,205,175,112,'Снеки',0);shelf(302,185,175,112,'Напитки',1);shelf(516,205,175,112,'Бакалея',2);shelf(302,333,175,90,'Бытовая химия',3);plant(82,375);plant(712,370);plant(760,250);round(535,365,180,64,8,'#79513d');round(535,358,180,13,5,'#f3dfc6');txt('КАССА',625,407,15,'#fff','800','center');round(666,331,30,30,4,'#2e383c');round(671,336,20,12,3,'#8de0a4');txt('CARD',681,356,6,'#fff','800','center');ctx.strokeStyle='#a77b55';ctx.lineWidth=3;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(500+i*34,450);ctx.lineTo(500+i*34,405);ctx.stroke()}round(752,165,125,190,12,'#b88b5d');txt('СКЛАД',814,190,14,'#fff','800','center');for(let i=0;i<8;i++){round(767+(i%2)*52,204+Math.floor(i/2)*34,39,26,4,'#cda06d');txt('×'+Math.min(99,s.warehouse[i%6]),786+(i%2)*52,221+Math.floor(i/2)*34,9,'#4c3626','800','center')}if(s.deliveries.length){round(18,398,120,52,10,'#5b7894');txt('🚚 '+Math.ceil(s.deliveries[0].time)+'с',78,429,11,'#fff','800','center')}for(const c of s.customers){drawChar(c);if(c.state==='shelf'||c.state==='inspect')round(c.x+18,c.y-51,60,22,8,'#fff');if(c.state==='shelf'||c.state==='inspect')txt(products[c.prod][3]+' '+effectivePrice(c.prod),c.x+48,c.y-36,9,'#3b3028','800','center');if(c.state==='queue')txt(c.cart.map(i=>products[i][3]).join(''),c.x+25,c.y-47,14,'#fff','800','center')}round(20,510,860,25,12,'#46362f');txt('Посетители '+s.visitors,45,527,10,'#fff','800');txt('Продажи '+s.sales,180,527,10,'#fff','800');txt('Очередь '+s.queue.length,295,527,10,'#fff','800');txt('Полки '+s.shelf.reduce((a,b)=>a+b,0),410,527,10,'#fff','800');txt('Склад '+s.warehouse.reduce((a,b)=>a+b,0)+'/'+s.warehouseCap,530,527,10,'#fff','800');txt('⭐ '+s.reputation.toFixed(1),650,527,10,'#f4d68c','800');txt('V26 TEST',815,527,9,'#d8b58a','800','right');ctx.restore()}
function renderHUD(){document.getElementById('money').textContent=money(s.money);document.getElementById('rep').textContent=s.reputation.toFixed(1).replace('.',',');document.getElementById('vis').textContent=s.visitors;document.getElementById('day').textContent='День '+s.day;document.getElementById('xp').textContent=Math.min(7200,5340+s.sales*8).toLocaleString('ru-RU');document.getElementById('xpbar').style.width=Math.min(100,(5340+s.sales*8)/72)+'%'}
function renderRight(){const profit=s.dayRevenue-s.dayExpenses;document.getElementById('right').innerHTML='<div class="card"><h3>📊 Сегодня</h3><div class="line"><span>Выручка</span><b class="green">'+money(s.dayRevenue)+'</b></div><div class="line"><span>Расходы</span><b class="red">− '+money(s.dayExpenses)+'</b></div><div class="line"><span>Прибыль</span><b class="green">'+money(profit)+'</b></div><div class="line"><span>Посетители</span><b>'+s.dayVisitors+'</b></div><div class="line"><span>Продажи</span><b>'+s.daySales+'</b></div></div><div class="card"><h3>🏆 Топ товаров</h3>'+products.map((p,i)=>({p,i,v:s.salesByProduct[i]})).sort((a,b)=>b.v-a.v).slice(0,3).map((x,n)=>'<div class="line"><span>'+(n+1)+'. '+x.p[0]+'</span><b>'+x.v+'</b></div>').join('')+'</div><div class="card promo"><h3>🏷️ Акция</h3><div>Скидка 10% помогает ускорить спрос.</div><button onclick="togglePromo(0)">'+(s.promo[0]?'Отключить скидку':'Включить скидку на хлеб')+'</button></div>'}
function openPanel(id){const p=document.getElementById('panel');if(id==='shop'){p.classList.remove('open');s.paused=false;return}s.paused=true;p.classList.add('open');let html='';if(id==='analytics')html='<h2>📊 Аналитика</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Продано: '+s.salesByProduct[i]+'<br>Спрос: '+Math.round(demand(i)*100)+'%<br>Цена: '+money(effectivePrice(i))+'<br>Закупка: '+money(supplierCost(i))+'</small></div>').join('')+'</div>';else if(id==='procurement')html='<h2>🚚 Поставщики</h2><div class="grid">'+Object.entries(suppliers).map(([k,v])=>'<div class="item"><b>'+v.name+'</b><small>×'+v.mult.toFixed(2)+' • '+v.time+' сек.<br>'+v.desc+'</small><button onclick="chooseSupplier(\''+k+'\')">'+(s.supplier===k?'Выбран':'Выбрать')+'</button></div>').join('')+'</div><button style="margin-top:10px;background:#6e5140;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800" onclick="order()">🚚 Заказать 48 шт.</button>';else if(id==='stock')html='<h2>📦 Склад</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>На полке: '+s.shelf[i]+'<br>На складе: '+s.warehouse[i]+'</small><button onclick="restockOne('+i+')">Выложить 3 шт.</button></div>').join('')+'</div>';else if(id==='staff')html='<h2>👥 Персонал</h2><div class="grid"><div class="item"><b>Кассир • уровень '+s.staff.cashier+'</b><small>Быстрее обслуживает очередь.</small><button onclick="upgradeStaff(\'cashier\')">Улучшить за '+money(2500*s.staff.cashier)+'</button></div><div class="item"><b>Продавец • уровень '+s.staff.seller+'</b><small>Автоматически пополняет полки.</small><button onclick="upgradeStaff(\'seller\')">Улучшить за '+money(2500*s.staff.seller)+'</button></div><div class="item"><b>Уборщик</b><small>Поддерживает репутацию.</small><button onclick="hireCleaner()">'+(s.staff.cleaner?'Уже нанят':'Нанять за 3 000 ₽')+'</button></div></div>';else if(id==='marketing')html='<h2>🏷️ Маркетинг</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Спрос '+Math.round(demand(i)*100)+'%</small><button onclick="togglePromo('+i+')">'+(s.promo[i]?'Скидка 10%':'Запустить скидку 10%')+'</button></div>').join('')+'</div>';else if(id==='dev')html='<h2>📈 Развитие</h2><div class="grid"><div class="item"><b>Расширение магазина</b><small>Больше места и полок.</small><button onclick="expand()">Расширить за '+money(12000*(s.expanded+1))+'</button></div><div class="item"><b>Реклама</b><small>Больше посетителей и репутации.</small><button onclick="advertise()">Запустить за '+money(3000*(s.ads+1))+'</button></div></div>';else if(id==='prices')html='<h2>💰 Цены</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Текущая: '+money(s.prices[i])+'<br>Рекомендованная: '+money(recPrice(i))+'</small><button onclick="setPrice('+i+')">Поставить рекомендуемую</button></div>').join('')+'</div>';else if(id==='settings')html='<h2>⚙️ Настройки</h2><div class="grid"><div class="item"><b>Сохранение</b><small>Прогресс хранится на этом устройстве в localStorage.</small><button onclick="saveNow()">💾 Сохранить сейчас</button></div><div class="item"><b>Новый тест</b><small>Полностью сбросит текущий прогресс и начнёт игру заново.</small><button onclick="resetGame()">↻ Сбросить прогресс</button></div><div class="item"><b>V26 TEST</b><small>Экономика и поведение покупателей обновлены.</small></div><div class="item"><b>Текущий день</b><small>День '+s.day+' • Выручка '+money(s.dayRevenue)+' • Продажи '+s.daySales+'</small><button onclick="endDay()">🌙 Завершить день</button></div></div>';else if(id==='products')html='<h2>🛒 Товары</h2><div class="grid">'+products.map((x,i)=>'<div class="item"><b>'+x[3]+' '+x[0]+'</b><small>Продано: '+s.salesByProduct[i]+' • спрос '+Math.round(demand(i)*100)+'%</small><button onclick="setPrice('+i+')">Настроить цену</button></div>').join('')+'</div>';p.innerHTML=html}
function chooseSupplier(k){s.supplier=k;save();openPanel('procurement');toast(suppliers[k].name+' выбран')}function order(){if(s.deliveries.length)return toast('Поставка уже в пути');const totalStock=s.warehouse.reduce((a,b)=>a+b,0);const free=Math.max(0,s.warehouseCap-totalStock);if(free<24)return toast('На складе мало места');const per=Math.max(4,Math.floor(Math.min(48,free)/6));const qty=products.map(()=>per);const cost=qty.reduce((a,n,i)=>a+n*supplierCost(i),0)+(suppliers[s.supplier]||suppliers.standard).fee;if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.dayExpenses+=cost;s.deliveries.push({time:suppliers[s.supplier].time,qty});s.orders++;save();toast('Грузовик отправлен 🚚')}function restockOne(i){const n=Math.min(3,s.warehouse[i],12-s.shelf[i]);if(n){s.warehouse[i]-=n;s.shelf[i]+=n;save();toast('Товар выложен на полку')}}function togglePromo(i){s.promo[i]=s.promo[i]?0:10;save();renderRight();toast(s.promo[i]?'Скидка 10% включена':'Скидка отключена');openPanel('marketing')}function setPrice(i){const r=recPrice(i);s.prices[i]=r;save();toast('Цена установлена: '+money(r));openPanel('prices')}function upgradeStaff(k){const cost=2500*s.staff[k];if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.staff[k]++;save();toast('Персонал улучшен');openPanel('staff')}function hireCleaner(){if(s.staff.cleaner)return; if(s.money<3000)return toast('Не хватает денег');s.money-=3000;s.staff.cleaner=1;save();openPanel('staff')}function expand(){const cost=12000*(s.expanded+1);if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.expanded++;s.shopLevel++;s.warehouseCap+=30;s.warehouse=s.warehouse.map(x=>x+3);s.shelf=s.shelf.map(x=>x+2);s.dailyGoal+=900;save();toast('Магазин расширен')}function advertise(){const cost=3000*(s.ads+1);if(s.money<cost)return toast('Не хватает денег');s.money-=cost;s.dayExpenses+=cost;s.ads++;s.reputation=Math.min(5,s.reputation+.08);save();toast('Реклама запущена')}function saveNow(){save();toast('Прогресс сохранён 💾')}function resetGame(){if(!confirm('Сбросить весь прогресс?'))return;localStorage.removeItem('myshop_v26');localStorage.removeItem('myshop_v25');localStorage.removeItem('myshop_v23');s=Object.assign({},defaults);s.staff=Object.assign({},defaults.staff);s.warehouse=defaults.warehouse.slice();s.shelf=defaults.shelf.slice();s.prices=defaults.prices.slice();s.salesByProduct=defaults.salesByProduct.slice();s.purchaseCosts=defaults.purchaseCosts.slice();s.costTrend=defaults.costTrend.slice();s.promo=defaults.promo.slice();s.customers=[];s.queue=[];s.deliveries=[];save();renderHUD();renderRight();openPanel('shop');toast('Новый тестовый запуск 🚀')}function dailyEvent(){const r=Math.random();if(r<.18){const i=Math.floor(Math.random()*6);s.costTrend[i]=Math.max(-8,Math.min(18,(s.costTrend[i]||0)+5));s.lastEvent='Поставщик поднял цену на '+products[i][0];toast('📈 '+s.lastEvent)}else if(r<.32){const i=Math.floor(Math.random()*6);s.costTrend[i]=Math.max(-8,(s.costTrend[i]||0)-5);s.lastEvent='Выгодная закупка: '+products[i][0];toast('📉 '+s.lastEvent)}else if(r<.42){s.lastEvent='Выходной: покупателей сегодня больше';s.dailyGoal=Math.round(s.dailyGoal*.92);toast('👥 Сегодня ожидается больше покупателей')}else{s.lastEvent='Обычный торговый день'}}function endDay(){const goalBonus=s.dayRevenue>=s.dailyGoal?Math.round(s.dailyGoal*.08):0;if(goalBonus){s.money+=goalBonus}const fixed=1200+s.staff.cashier*450+s.staff.seller*400+s.staff.cleaner*350;s.money-=fixed;s.dayExpenses+=fixed;s.dailyHistory.push({day:s.day,revenue:s.dayRevenue,expenses:s.dayExpenses,profit:s.dayRevenue-s.dayExpenses,sales:s.daySales,visitors:s.dayVisitors});s.day++;dailyEvent();s.dayRevenue=0;s.dayExpenses=0;s.daySales=0;s.dayVisitors=0;s.queue=[];s.customers=[];s.deliveries=[];s.reputation=Math.max(1,Math.min(5,s.reputation+(s.complaints?-.02:.01)));s.complaints=0;s.dailyGoal=Math.round(s.dailyGoal*1.04);s.events=[];save();toast(goalBonus?'Цель выполнена! Бонус '+money(goalBonus)+' 🎉':'Начался день '+s.day);renderRight()}
addEventListener('keydown',e=>{if(e.key==='Escape')openPanel('shop');if(e.key.toLowerCase()==='s')saveNow();if(e.key.toLowerCase()==='d')endDay()});for(const b of [...document.querySelectorAll('[data-panel]')])b.addEventListener('click',()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('[data-panel="'+b.dataset.panel+'"]').forEach(x=>x.classList.add('active'));openPanel(b.dataset.panel)});renderHUD();renderRight();requestAnimationFrame(update);setInterval(save,5000);
</script></body></html>
